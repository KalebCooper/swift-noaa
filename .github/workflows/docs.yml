name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN plus the scopes deploy-pages needs to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages publish in flight at a time; never cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocC site
    runs-on: macos-26
    # Every job in this repository is bounded, so a hang fails the job instead of sitting for the
    # six-hour default. The ceiling is meant to be that job's slowest green run on `main` under its
    # current definition, rounded up to the next five minutes and then tripled. `Scripts/verify.sh`
    # holds the rule that every job has one.
    # Provisional: this repository has no green run yet, so the ceiling is swifty-networking's for
    # the matching job. Replace it with this job's own figure once it has green runs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Show Xcode version
        run: xcodebuild -version

      # Names the schemes SwiftPM generated, so a scheme rename shows up here rather than as an
      # unexplained failure in the per-product builds below.
      - name: List schemes
        run: xcodebuild -list

      # Built one product at a time rather than through the whole-package scheme, because SwiftNWS has
      # to be told where SwiftNWSModels' documentation is before its own links to it can resolve. DocC
      # does not reach into another module on its own: the source writes ``/SwiftNWSModels/Endpoint``
      # in NWSClient's doc comments, and without the two flags below DocC finds nothing and renders the
      # link as plain text. The flags are experimental, so a toolchain bump can rename them; the pass
      # order is the dependency order: SwiftNWSModels is built first and publishes link metadata, then
      # SwiftNWS resolves against that archive.
      #
      # Destination and simulator OS mirror ci.yml's apple lane; see the note there on why it is the
      # lowest runtime the image carries. -derivedDataPath pins where the archives land.
      # Its own derived data, because building SwiftNWS builds SwiftNWSModels' documentation again as
      # part of the same graph. Sharing one directory would have the second pass rewriting the very
      # archive it was told to resolve against.
      - name: Build SwiftNWSModels documentation
        run: |
          set -o pipefail
          xcodebuild docbuild \
            -scheme SwiftNWSModels \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -derivedDataPath .derivedData-models \
            -skipPackagePluginValidation \
            OTHER_DOCC_FLAGS='--enable-experimental-external-link-support' \
            | xcbeautify --renderer github-actions

      # Lifted out of derived data entirely, so the path handed to --dependency belongs to nothing that
      # a later build writes to. This copy is also what the merge step reads: it is the archive the
      # dependent product actually resolved against.
      - name: Stage SwiftNWSModels archive
        id: models
        run: |
          set -euo pipefail
          found="$(find .derivedData-models -type d -name 'SwiftNWSModels.doccarchive' | head -1)"
          if [ -z "$found" ]; then
            echo "::error::no SwiftNWSModels.doccarchive under .derivedData-models"
            exit 1
          fi
          mkdir -p .docc-deps
          cp -R "$found" .docc-deps/SwiftNWSModels.doccarchive
          if [ ! -f .docc-deps/SwiftNWSModels.doccarchive/linkable-entities.json ]; then
            echo "::error::SwiftNWSModels.doccarchive carries no link metadata; the flag did not take"
            exit 1
          fi
          echo "archive=$PWD/.docc-deps/SwiftNWSModels.doccarchive" >> "$GITHUB_OUTPUT"

      # SwiftNWS resolves against SwiftNWSModels' staged archive, and publishes its own link metadata
      # too so the pair stays symmetrical if something later needs to link into it.
      - name: Build SwiftNWS documentation
        run: |
          set -o pipefail
          xcodebuild docbuild \
            -scheme SwiftNWS \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -derivedDataPath .derivedData \
            -skipPackagePluginValidation \
            OTHER_DOCC_FLAGS="--enable-experimental-external-link-support --dependency ${{ steps.models.outputs.archive }}" \
            | xcbeautify --renderer github-actions

      # Two products means two archives. A merged archive gets a synthesized landing page at
      # /documentation/ that lists both modules, so one site covers the whole package. The test support
      # target is in no product and is not documented.
      - name: Merge archives
        run: |
          set -euo pipefail
          found="$(find .derivedData -type d -name 'SwiftNWS.doccarchive' | head -1)"
          if [ -z "$found" ]; then
            echo "::error::no SwiftNWS.doccarchive under .derivedData"
            exit 1
          fi
          "$(xcrun --find docc)" merge .docc-deps/SwiftNWSModels.doccarchive "$found" \
            --synthesized-landing-page-name swift-noaa \
            --synthesized-landing-page-kind Package \
            --output-path .merged.doccarchive

      # Rewrite the archive for static hosting under the Pages sub-path
      # (site serves from https://<owner>.github.io/swift-noaa/).
      - name: Transform for static hosting
        run: |
          set -euo pipefail
          "$(xcrun --find docc)" process-archive transform-for-static-hosting \
            .merged.doccarchive \
            --output-path _site \
            --hosting-base-path swift-noaa

      # DocC's static-hosting output has no landing page at the site root: the bare index.html is an
      # app shell that keeps baseUrl "/" (so its assets 404 under the Pages sub-path) and has no route
      # to render. Replace it with a redirect into the merged landing route so the bare URL works.
      - name: Write root redirect
        run: |
          set -euo pipefail
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=documentation/">
              <link rel="canonical" href="https://kalebcooper.github.io/swift-noaa/documentation/">
              <title>swift-noaa</title>
            </head>
            <body>
              <p>Redirecting to the <a href="documentation/">swift-noaa documentation</a>…</p>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Only main publishes. A workflow_dispatch on any other ref builds and stops, so an experiment
    # cannot overwrite the live site.
    if: github.ref == 'refs/heads/main'
    # Provisional, from swifty-networking's matching job; replace it once this job has green runs.
    # The job is a single action call.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
